services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: manageusers-sqlserver
    hostname: manageusers-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - manageusers_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  manageusers_sqlserver_data:
