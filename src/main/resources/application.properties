spring.application.name=manageusers

# Configuración de conexión a Microsoft SQL Server (Base de pruebas: P501_PERF)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=${DB_NAME:P501_PERF};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:use1}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Validación estricta de esquema JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

# Modo de ejecución de la aplicación: 'performance', 'queries' o 'idle' (modo seguro por defecto)
app.mode=idle

# ---- Parámetros de la práctica de rendimiento (Sesión 7) ----
# Qué prueba ejecutar: 1.1 (Caché L2), 1.2 (Batching) o 2 (Consultas y Fetching)
performance.prueba=2
performance.num-usuarios=1000
performance.num-modificaciones=50
performance.detach-entidad=true
performance.flush-cambios=true

# Parámetros específicos de la Prueba 2
performance.prueba2.id-min=1010
performance.prueba2.id-max=1020
performance.prueba2.variante=hql
performance.prueba2.recorrer-conexiones=true
performance.prueba2.mostrar-conexiones=false

# ---- Configuración de Caché de Segundo Nivel (JCache + Ehcache 3) ----
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.region.factory_class=jcache
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.hibernate.javax.cache.uri=ehcache.xml
spring.jpa.properties.hibernate.javax.cache.missing_cache_strategy=create

# ---- Configuración de Batching JDBC ----
spring.jpa.properties.hibernate.jdbc.batch_size=0
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
